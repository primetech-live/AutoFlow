name: AutoFlow CI/CD

on:
  push:
    branches: [ main, beta ]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
    branches: [ main, beta ]

permissions:
  contents: write

jobs:
  # ─── Stage 1: Quality Gate ────────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm test

  # ─── Stage 2: Cross-Platform Build ───────────────────────────────────────
  build:
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - os: windows-latest
            target_flag: --win
          - os: ubuntu-latest
            target_flag: --linux
          - os: macos-latest
            target_flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libopenjp2-7

      - run: npm install
      - run: npm run build

      # On branch pushes: just package locally, never publish
      - name: Package (branch push — no publish)
        if: github.ref_type != 'tag'
        run: |
          mkdir -p release
          echo "${{ github.ref_name }}-${{ github.sha }}" > release/VERSION
          npm run dist -- ${{ matrix.target_flag }} -p never

      # On tag pushes: package and upload artifacts
      - name: Package & Upload (tag)
        if: github.ref_type == 'tag'
        run: |
          mkdir -p release
          npm run dist -- ${{ matrix.target_flag }} -p always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autoflow-package-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  # Stage 3: Publish binaries to public repo using Git LFS
  publish-binaries:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          path: collected-artifacts
          merge-multiple: true
      - name: Set up Git LFS
        run: |
          sudo apt-get update && sudo apt-get install -y git-lfs
          git lfs install
      - name: Clone public releases repo
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config --global user.email "ci@autoflow.tech"
          git config --global user.name "AutoFlow CI"
          git clone https://x-access-token:${GIT_TOKEN}@github.com/primetech-live/Autoflow-Release.git public-repo
      - name: Copy binaries to public repo
        run: |
          mkdir -p public-repo/release
          find collected-artifacts -type f -exec cp -t public-repo/release {} +
      - name: Track binaries with Git LFS
        run: |
          cd public-repo
          git lfs track "release/*"
          git add .gitattributes
      - name: Commit & push binaries
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          cd public-repo
           git add -A
           echo "=== git status before commit ==="
           git status -s
           git commit -m "chore: publish binaries for ${{ github.ref_name }}" || echo "No changes to commit"
           # Tag the release
           git tag ${{ github.ref_name }}
           git push origin ${{ github.ref_name }}
           git push

           # Create GitHub release using the tag
           curl -X POST -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/primetech-live/Autoflow-Release/releases \
                -d '{"tag_name":"${{ github.ref_name }}","name":"AutoFlow ${{ github.ref_name }}","body":"AutoFlow release ${{ github.ref_name }}","draft":false,"prerelease":false}'
