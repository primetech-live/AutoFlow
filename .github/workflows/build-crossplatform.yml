name: AutoFlow CI/CD

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoflow-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── GATE 1: Code Integrity & Unit Tests ─────────────────────────────────────
  quality-gate-1-unit-tests:
    name: "Gate 1: Unit & Integration Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit & integration tests
        run: npm test

  # ── GATE 2: Production Bundle Compilation Check ──────────────────────────────
  quality-gate-2-build-verify:
    name: "Gate 2: Production Bundle Compilation"
    needs: quality-gate-1-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Compile production bundle
        run: npm run build

  # ── BUILD & DIRECT PUBLISH TO RELEASE REPO ─────────────────────────────────
  build-and-publish:
    name: Build & Direct Publish (${{ matrix.os }})
    needs: quality-gate-2-build-verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_flag: --win
          - os: ubuntu-latest
            target_flag: --linux
          - os: macos-latest
            target_flag: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libopenjp2-7 git-lfs

      - name: Install dependencies
        run: npm install

      - name: Sync version with tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Setting package version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm install

      - name: Build Production Assets
        run: npm run build

      - name: Build Standalone CLI Binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npx @yao-pkg/pkg dist/cli.js --target node18-win-x64 --out-path dist/bin
          elif [ "${{ runner.os }}" = "Linux" ]; then
            npx @yao-pkg/pkg dist/cli.js --target node18-linux-x64 --out-path dist/bin
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npx @yao-pkg/pkg dist/cli.js --target node18-macos-x64 --out-path dist/bin
          fi

      - name: Package Binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          mkdir -p release
          npm run dist -- ${{ matrix.target_flag }} -p always

      - name: Direct Publish Executables to Autoflow-Release Repo
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config --global user.email "ci@autoflow.tech"
          git config --global user.name "AutoFlow CI"
          git clone https://x-access-token:${GIT_TOKEN}@github.com/primetech-live/Autoflow-Release.git public-repo
          mkdir -p public-repo/release
          
          # Copy OS binaries directly
          cp release/*.exe public-repo/release/ 2>/dev/null || true
          cp release/*.dmg public-repo/release/ 2>/dev/null || true
          cp release/*.AppImage public-repo/release/ 2>/dev/null || true
          cp release/*.deb public-repo/release/ 2>/dev/null || true

          cd public-repo
          git lfs install 2>/dev/null || true
          git lfs track "release/*" 2>/dev/null || true
          git add .gitattributes release/ 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish ${{ matrix.os }} binaries for ${{ github.ref_name }}"
            git push origin main
          fi

          gh release create "${{ github.ref_name }}" \
            --repo primetech-live/Autoflow-Release \
            --title "AutoFlow ${{ github.ref_name }}" \
            --notes "AutoFlow release ${{ github.ref_name }}" \
            --target main || true

          gh release upload "${{ github.ref_name }}" release/* \
            --repo primetech-live/Autoflow-Release --clobber 2>/dev/null || true

