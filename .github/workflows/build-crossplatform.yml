name: AutoFlow CI/CD

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoflow-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_flag: --win
          - os: ubuntu-latest
            target_flag: --linux
          - os: macos-latest
            target_flag: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libopenjp2-7

      - name: Install dependencies
        run: npm install

      - name: Sync version with tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Setting package version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm install

      - name: Build
        run: npm run build

      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          mkdir -p release
          npm run dist -- ${{ matrix.target_flag }} -p always

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autoflow-package-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  publish-binaries:
    name: Publish Binaries
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          path: collected-artifacts
          merge-multiple: true

      - name: Set up Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Clone public releases repo
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config --global user.email "ci@autoflow.tech"
          git config --global user.name "AutoFlow CI"
          git clone https://x-access-token:${GIT_TOKEN}@github.com/primetech-live/Autoflow-Release.git public-repo

      - name: Clean old release assets
        run: |
          rm -rf public-repo/release/*
          mkdir -p public-repo/release

      - name: Copy binaries to public repo
        run: |
          find collected-artifacts -type f -exec cp {} public-repo/release/ \;

      - name: Track binaries with Git LFS
        run: |
          cd public-repo
          git lfs track "release/*"
          git add .gitattributes

      - name: Commit & push binaries
        shell: bash
        run: |
          cd public-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: publish binaries for ${{ github.ref_name }}"
          git push origin main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo primetech-live/Autoflow-Release \
            --title "AutoFlow ${{ github.ref_name }}" \
            --notes "AutoFlow release ${{ github.ref_name }}" \
            --target main || echo "Release already exists"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" public-repo/release/* \
            --repo primetech-live/Autoflow-Release --clobber
