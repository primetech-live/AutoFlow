name: AutoFlow CI/CD

on:
  push:
    branches: [ main, beta ]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
    branches: [ main, beta ]

permissions:
  contents: write

jobs:
  # ─── Stage 1: Quality Gate ────────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm test

  # ─── Stage 2: Cross-Platform Build ───────────────────────────────────────
  build:
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - os: windows-latest
            target_flag: --win
          - os: ubuntu-latest
            target_flag: --linux
          - os: macos-latest
            target_flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libopenjp2-7

      - run: npm install
      - run: npm run build

      # On branch pushes: just package locally, never publish
      - name: Package (branch push — no publish)
        if: github.ref_type != 'tag'
        run: npm run dist -- ${{ matrix.target_flag }} -p never

      # On tag pushes: package AND publish to primetech-live/Autoflow-Release (public repo)
      - name: Package & Publish Release
        if: github.ref_type == 'tag'
        run: npm run dist -- ${{ matrix.target_flag }} -p always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autoflow-package-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  # ─── Stage 3: Publish Website to Autoflow-Release Repo ───────────────────
  publish-website:
    needs: lint-and-test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy website/ to primetech-live/Autoflow-Release
        run: |
          git config --global user.email "ci@autoflow.tech"
          git config --global user.name "AutoFlow CI"

          # Clone the public releases repo
          git clone https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/primetech-live/Autoflow-Release.git public-repo

          # Sync website/ folder contents into the public repo
          rsync -av --delete website/ public-repo/website/

          cd public-repo
          git add -A
          git diff --staged --quiet || git commit -m "chore: update website for release ${{ github.ref_name }}"
          git push
