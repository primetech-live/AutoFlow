name: AutoFlow CI/CD

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoflow-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── GATE 1: Code Integrity & Unit Tests ─────────────────────────────────────
  quality-gate-1-unit-tests:
    name: "Gate 1: Unit & Integration Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit & integration tests
        run: npm test

  # ── GATE 2: Production Bundle Compilation Check ──────────────────────────────
  quality-gate-2-build-verify:
    name: "Gate 2: Production Bundle Compilation"
    needs: quality-gate-1-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Compile production bundle
        run: npm run build

  # ── BUILD & DIRECT PUBLISH TO RELEASE REPO ─────────────────────────────────
  build-and-publish:
    name: Build & Direct Publish (${{ matrix.os }})
    needs: quality-gate-2-build-verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_flag: --win
          - os: ubuntu-latest
            target_flag: --linux
          - os: macos-latest
            target_flag: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libopenjp2-7 git-lfs

      - name: Install dependencies
        run: npm install

      - name: Sync version with tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Setting package version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm install

      - name: Build Production Assets
        run: npm run build

      - name: Package Binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          mkdir -p release
          npm run dist -- ${{ matrix.target_flag }} -p never

      # ── PUBLISH DIRECTLY TO MICROSOFT STORE (WINDOWS RUNNER ONLY) ─────────────
      - name: Setup Microsoft Store CLI
        if: matrix.os == 'windows-latest'
        uses: microsoft/microsoft-store-apppublisher@v1

      - name: Auto-Publish Package to Microsoft Store
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          SELLER_ID: "96693990"
          PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
        run: |
          echo "y" | msstore reconfigure --tenantId "$env:TENANT_ID" --sellerId "$env:SELLER_ID" --clientId "$env:CLIENT_ID" --clientSecret "$env:CLIENT_SECRET"
          $appxFile = (Get-ChildItem -Path release -Filter "*.appx" | Select-Object -First 1).FullName
          if ($appxFile) {
            Write-Host "Publishing $appxFile to Microsoft Store ID: $env:PRODUCT_ID ..."
            msstore publish "$appxFile" -id "$env:PRODUCT_ID"
            Write-Host "Successfully published package to Microsoft Store!"
          } else {
            Write-Warning "No .appx package found in release directory to publish."
          }

      - name: Direct Publish Executables to Autoflow-Release Repo
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config --global user.email "ci@autoflow.tech"
          git config --global user.name "AutoFlow CI"
          git clone https://x-access-token:${GIT_TOKEN}@github.com/primetech-live/Autoflow-Release.git public-repo
          mkdir -p public-repo/release
          
          # Delete legacy Setup file names if present
          rm -f public-repo/release/*Setup*.exe 2>/dev/null || true
          
          # Copy OS binaries directly (appx is published directly to Microsoft Store, not to public repo)
          cp release/*.exe public-repo/release/ 2>/dev/null || true
          cp release/*.dmg public-repo/release/ 2>/dev/null || true
          cp release/*.AppImage public-repo/release/ 2>/dev/null || true
          cp release/*.deb public-repo/release/ 2>/dev/null || true
          rm -f public-repo/release/*Setup*.exe 2>/dev/null || true

          cd public-repo
          # Clean old versions from git tracking so public-repo only retains current version
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          find release -type f ! -name "*${VERSION}*" -delete 2>/dev/null || true

          git lfs install 2>/dev/null || true
          git lfs track "release/*" 2>/dev/null || true
          git add -A .gitattributes release/ 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish ${{ matrix.os }} binaries for ${{ github.ref_name }}"
            for i in {1..5}; do
              git fetch origin main && git rebase origin/main && git push origin main && break || sleep 5
            done
          fi

          cd ..

          # Upload fresh release assets and explicitly delete any legacy Setup asset
          gh release create "${{ github.ref_name }}" \
            --repo primetech-live/Autoflow-Release \
            --title "AutoFlow ${{ github.ref_name }}" \
            --notes "AutoFlow release ${{ github.ref_name }}" \
            --target main || true

          # Delete old Setup exe asset from GitHub Release using exact matching
          OLD_ASSET_ID=$(gh api repos/primetech-live/Autoflow-Release/releases/tags/${{ github.ref_name }} --jq '.assets[] | select(.name | contains("Setup")) | .id' 2>/dev/null || true)
          if [ -n "$OLD_ASSET_ID" ]; then
            gh api -X DELETE repos/primetech-live/Autoflow-Release/releases/assets/$OLD_ASSET_ID 2>/dev/null || true
          fi

          # Only upload pure installer binaries for website users (exe, dmg, AppImage, deb - no appx)
          for f in release/*.exe release/*.dmg release/*.AppImage release/*.deb; do
            if [ -f "$f" ]; then
              gh release upload "${{ github.ref_name }}" "$f" \
                --repo primetech-live/Autoflow-Release --clobber 2>/dev/null || true
            fi
          done

